<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golem</title>
    <!-- Theme before first paint: app.tsx sets it again in an effect, too late to stop a white frame on reload. -->
    <script>
      try { document.documentElement.dataset.golemTheme = localStorage.getItem('golem.theme') === 'light' ? 'light' : 'dark' } catch { document.documentElement.dataset.golemTheme = 'dark' }
    </script>
    <style>
      html { background: #fff; color-scheme: light; }
      html[data-golem-theme='dark'] { background: oklch(20.5% 0 0); color-scheme: dark; } /* golem-ui Shell: bg-white / dark:bg-neutral-900 */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/browser/main.tsx"></script>
  </body>
</html>
